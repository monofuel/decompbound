name: Github Actions
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: treeform/setup-nim-action@v6
    - name: Install native input development libraries
      run: sudo apt-get update && sudo apt-get install -y libudev-dev libevdev-dev
    - run: nimby sync -g nimby.lock
    - run: make test
    - run: nim r src/decompbound.nim
