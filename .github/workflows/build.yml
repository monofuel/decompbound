name: Github Actions
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: treeform/setup-nim-action@v6
    - name: Install native browser test libraries
      run: sudo apt-get update && sudo apt-get install -y libudev-dev libevdev-dev libgl1
    - run: nimby sync -g nimby.lock
    - run: make test
    - name: Build command-line entry point
      run: nim c src/decompbound.nim
    - name: Check synthetic ROM round trips
      run: nim r tests/integration_rom_pipeline.nim
